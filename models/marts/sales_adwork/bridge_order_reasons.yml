version: 2

models:
  - name: bridge_order_reasons
    description: "Bridge table connecting sales order headers to individual sales reasons (1 order can have multiple reasons)."
    columns:
      - name: order_reason_sk
        description: "Primary surrogate key for each order and sales reason combination."
        tests:
          - unique
          - not_null

      - name: order_fk
        description: "Foreign key referencing the sales order header."
        tests:
          - not_null

      - name: reason_fk
        description: "Foreign key referencing dim_reasons."
        tests:
          - not_null
          - relationships:
              to: ref('dim_reasons')
              field: reason_sk
version: 2

models:
  # ==========================================
  # FACT TABLE
  # ==========================================
  - name: fct_orders
    description: "Consolidated sales order fact table at the order item line granularity."
    columns:
      - name: order_item_sk
        description: "Primary surrogate key identifying each unique order item line."
        tests:
          - unique
          - not_null

      - name: order_pk
        description: "Business key for the sales order header."
        tests:
          - not_null

      - name: customer_fk
        description: "Foreign key referencing dim_customers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_sk

      - name: credit_card_fk
        description: "Foreign key referencing dim_credit_cards."
        tests:
          - not_null
          - relationships:
              to: ref('dim_credit_cards')
              field: credit_card_sk

      - name: address_fk
        description: "Foreign key referencing dim_territories."
        tests:
          - not_null
          - relationships:
              to: ref('dim_territories')
              field: address_sk

      - name: product_fk
        description: "Foreign key referencing dim_products."
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_sk

      - name: order_date
        description: "Date when the order was placed."
        tests:
          - not_null

      - name: order_status
        description: "Current status of the order."

      - name: sales_reason_name
        description: "Aggregated sales reason names associated with the order."

      - name: quantity
        description: "Quantity of items ordered."
        tests:
          - not_null

      - name: unit_price
        description: "Unit price of the product."
        tests:
          - not_null

      - name: discount_pct
        description: "Discount percentage applied to the item."

      - name: gross_total
        description: "Gross total revenue (quantity * unit_price)."

      - name: discount_total
        description: "Total discount amount applied."

      - name: net_total
        description: "Net revenue for the item line (gross_total - discount_total)."
        tests:
          - not_null

  # ==========================================
  # DIMENSION TABLES
  # ==========================================
  - name: dim_customers
    description: "Customer dimension containing registration details for both Individual and Corporate clients."
    columns:
      - name: customer_sk
        description: "Primary surrogate key for the customer dimension."
        tests:
          - unique
          - not_null

      - name: customer_name
        description: "Full name or store name of the customer."

      - name: customer_type
        description: "Category type of the registered customer."
        tests:
          - accepted_values:
              values:
                - 'Individual'
                - 'Corporate Store'
                - 'Corporate Store (with Contact)'
                - 'Not Informed'
                - 'Not Applicable'

      - name: territory_fk
        description: "Foreign key referencing the primary territory/region."

  - name: dim_products
    description: "Product dimension containing Category, Subcategory, and Model hierarchies."
    columns:
      - name: product_sk
        description: "Primary surrogate key for the product dimension."
        tests:
          - unique
          - not_null

      - name: product_name
        description: "Name of the product."

      - name: product_number
        description: "Internal product tracking code."

      - name: subcategory_name
        description: "Subcategory name of the product."

      - name: category_name
        description: "Top-level category name of the product."

      - name: model_name
        description: "Model name of the product."

      - name: standard_cost
        description: "Standard production cost of the product."

      - name: list_price
        description: "Standard listing price of the product."

  - name: dim_territories
    description: "Geographic dimension containing shipping locations (City, State, and Country)."
    columns:
      - name: address_sk
        description: "Primary surrogate key for the territory dimension."
        tests:
          - unique
          - not_null

      - name: address_line
        description: "Street address line."

      - name: city_name
        description: "Name of the city."

      - name: state_code
        description: "State or province code."

      - name: state_name
        description: "State or province name."

      - name: country_code
        description: "Country or region code."

      - name: country_name
        description: "Country or region name."

  - name: dim_credit_cards
    description: "Credit card dimension containing payment card types."
    columns:
      - name: credit_card_sk
        description: "Primary surrogate key for the credit card dimension."
        tests:
          - unique
          - not_null

      - name: card_type
        description: "Brand or provider type of the credit card."

  - name: dim_reasons
    description: "Sales reasons dimension aggregated at the order level."
    columns:
      - name: order_fk
        description: "Primary order key linking to the sales reasons."
        tests:
          - unique
          - not_null

      - name: sales_reason_name
        description: "Aggregated text string of reason names."
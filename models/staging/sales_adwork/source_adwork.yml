version: 2

# ==========================================
# 1. SOURCES (Raw database tables)
# ==========================================
sources:
  - name: adwork
    database: fea_academy
    schema: adventure_works
    description: "Raw relational source data for Adventure Works."
    tables:
      - name: sales_salesorderheader
        description: "Raw table containing sales order header information."
        columns:
          - name: salesorderid
            description: "Primary key of the sales order header table."
            tests:
              - unique
              - not_null

          - name: customerid
            description: "Foreign key referencing the customer table."
            tests:
              - not_null

          - name: shiptoaddressid
            description: "Foreign key referencing the shipping address."
            tests:
              - not_null

      - name: sales_salesorderdetail
        description: "Raw table containing line items for sales orders."
        columns:
          - name: salesorderid
            description: "Foreign key referencing the sales order header."
            tests:
              - not_null

          - name: productid
            description: "Foreign key referencing the product table."
            tests:
              - not_null

      - name: sales_salesorderheadersalesreason
        description: "Raw bridge table linking sales orders to sales reasons."
        columns:
          - name: salesorderid
            description: "Foreign key referencing the sales order header."
            tests:
              - not_null

          - name: salesreasonid
            description: "Foreign key referencing the sales reason table."
            tests:
              - not_null

      - name: sales_salesreason
        description: "Raw catalog table containing names and types of sales reasons."
        columns:
          - name: salesreasonid
            description: "Primary key of the sales reason table."
            tests:
              - unique
              - not_null

      - name: sales_customer
        description: "Raw customer master table."
        columns:
          - name: customerid
            description: "Primary key of the customer table."
            tests:
              - unique
              - not_null

      - name: person_person
        description: "Raw individual person contact table."
        columns:
          - name: businessentityid
            description: "Primary key of the person table."
            tests:
              - unique
              - not_null

      - name: sales_store
        description: "Raw corporate store table."
        columns:
          - name: businessentityid
            description: "Primary key of the store table."
            tests:
              - unique
              - not_null

      - name: sales_creditcard
        description: "Raw credit card payment details table."
        columns:
          - name: creditcardid
            description: "Primary key of the credit card table."
            tests:
              - unique
              - not_null

      - name: person_address
        description: "Raw address line details table."
        columns:
          - name: addressid
            description: "Primary key of the address table."
            tests:
              - unique
              - not_null

          - name: stateprovinceid
            description: "Foreign key referencing the state or province."
            tests:
              - not_null

      - name: person_stateprovince
        description: "Raw state and province master table."
        columns:
          - name: stateprovinceid
            description: "Primary key of the state or province table."
            tests:
              - unique
              - not_null

          - name: countryregioncode
            description: "Country or region code."
            tests:
              - not_null

          - name: stateprovincecode
            description: "State or province code."
            tests:
              - not_null

      - name: person_countryregion
        description: "Raw country and region master table."
        columns:
          - name: countryregioncode
            description: "Primary key code for the country or region."
            tests:
              - unique

      - name: production_product
        description: "Raw product catalog master table."
        columns:
          - name: productid
            description: "Primary key of the product table."
            tests:
              - unique
              - not_null

      - name: production_productsubcategory
        description: "Raw product subcategory table."
        columns:
          - name: productsubcategoryid
            description: "Primary key of the product subcategory table."
            tests:
              - unique
              - not_null

      - name: production_productcategory
        description: "Raw product category table."
        columns:
          - name: productcategoryid
            description: "Primary key of the product category table."
            tests:
              - unique
              - not_null

      - name: production_productmodel
        description: "Raw product model table."
        columns:
          - name: productmodelid
            description: "Primary key of the product model table."
            tests:
              - unique
              - not_null

# ==========================================
# 2. STAGING MODELS
# ==========================================
models:
  - name: stg_adwork__order_details
    description: "Staging model containing cleaned sales order line items."
    columns:
      - name: order_item_sk
        description: "Surrogate key generated from salesorderid and productid."
        tests:
          - unique
          - not_null